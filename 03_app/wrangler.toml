# Cloudflare Pages project: the page (public/) + the API (functions/) + D1 database + R2 bucket
name = "hackathon-team1-weld-app"
pages_build_output_dir = "./public"
compatibility_date = "2026-11-01"

# Plain settings, readable by the functions as env.MODEL_URL
[vars]
# Our model server API on Render (/gradio = the /predict API; the main address is NEURAL / LAB). No slash at the end
MODEL_URL = "https://hackathon-team1-weld-anomaly.onrender.com/gradio"
MODEL_API_NAME = "predict"
# MOCK: "1" = do not call the model server, return a made-up answer (to build the page without the server or the data)
#       "0" = call the real model server at MODEL_URL
MOCK_MODEL = "0"

# The database: `npx wrangler d1 create hackathon-team1-weld-db` prints the id to paste here
[[d1_databases]]
binding = "DB"
database_name = "hackathon-team1-weld-db"
database_id = "3a29ff15-ae97-4f11-930e-639b82b456fd"

# File storage for the uploaded images: `npx wrangler r2 bucket create hackathon-team1-weld-images`
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "hackathon-team1-weld-images"

# The password is NOT here: it is a secret.
# Local:   put APP_PASSWORD=... in a .dev.vars file (never commit it)
# Online:  npx wrangler pages secret put APP_PASSWORD
